<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Frontend Mentor | Fylo data storage component</title>
        <meta
            name="description"
            content="A Fylo data storage component built with HTML and CSS as part of Frontend Mentor challenges."
        />
        <meta name="author" content="Ayman Dghim" />
    </head>
    <body>
        <main class="storage-card">
            <section class="storage-card__actions">
                <img
                    src="images/logo.svg"
                    alt="Fylo"
                    class="storage-card__logo"
                />
                <div class="storage-card__tools">
                    <img
                        src="images/icon-document.svg"
                        alt=""
                        class="storage-card__tool-icon"
                    />
                    <img
                        src="images/icon-folder.svg"
                        alt=""
                        class="storage-card__tool-icon"
                    />
                    <img
                        src="images/icon-upload.svg"
                        alt=""
                        class="storage-card__tool-icon"
                    />
                </div>
            </section>
            <section class="storage-card__usage">
                <div class="storage-card__remaining">
                    <span class="storage-card__remaining-value">185</span>
                    <span class="storage-card__remaining-label">GB Left</span>
                </div>
                <p>
                    You've used
                    <span class="storage-card__used-value">815 GB</span> of your
                    storage
                </p>
                <div
                    class="storage-card__progress"
                    role="progressbar"
                    aria-label="Storage used"
                    aria-valuemin="0"
                    aria-valuemax="1000"
                    aria-valuenow="815"
                    aria-valuetext="815 GB of 1000 GB used"
                >
                    <span class="storage-card__progress-fill"></span>
                </div>
                <div class="storage-card__scale">
                    <span>0 GB</span>
                    <span>1000 GB</span>
                </div>
            </section>
        </main>

        <footer class="attribution">
            Challenge by
            <a
                href="https://www.frontendmentor.io?ref=challenge"
                class="attribution__link"
                >Frontend Mentor</a
            >. Coded by
            <a href="https://github.com/Ayman-daghim" class="attribution__link"
                >Ayman Dghim</a
            >.
        </footer>
    </body>
</html>
